services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bptracker
      POSTGRES_PASSWORD: bptracker
      POSTGRES_DB: bptracker
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bptracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://bptracker:bptracker@db:5432/bptracker
      # Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploying}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
